name: "Build Multiplatform & Release"

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Specify tag to release (e.g. v0.9.1)"
        required: true
        default: "v0.9.1"
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    name: Build macOS Universal
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Build macOS Universal binary
        run: bash scripts/build-macos.sh universal

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: hawk-terminal-universal-macos
          path: target/release/hawk-terminal-universal-macos.tar.gz

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libudev-dev \
            libxkbcommon-dev \
            libasound2-dev \
            libfontconfig1-dev \
            libxcb-render0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Package Linux archive
        run: bash scripts/package-linux.sh package x86_64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: hawk-terminal-x86_64-linux
          path: target/release/hawk-terminal-x86_64-linux.tar.gz

  build-windows:
    name: Build Windows x86_64 Installer
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release binary
        run: cargo build --release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Windows setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: hawk-terminal-windows-setup
          path: target/installer/hawk-terminal-x86_64-setup.exe

  create-release:
    name: Publish GitHub Release
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten assets directory
        run: |
          mkdir -p final-assets
          cp release-assets/hawk-terminal-universal-macos/hawk-terminal-universal-macos.tar.gz final-assets/ || true
          cp release-assets/hawk-terminal-x86_64-linux/hawk-terminal-x86_64-linux.tar.gz final-assets/ || true
          cp release-assets/hawk-terminal-windows-setup/hawk-terminal-x86_64-setup.exe final-assets/ || true
          cd final-assets && sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Hawk Terminal ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          files: |
            final-assets/*
