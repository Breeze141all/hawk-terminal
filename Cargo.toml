[package]
name = "hawk-terminal"
version = "0.9.6"
readme = "README.md"
license = "GPL-3.0-or-later"
description = "A native desktop charting platform for crypto markets"
categories = ["finance", "visualization", "gui"]
edition.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "hawk_terminal"
path = "src/lib.rs"

[[bin]]
name = "hawk-terminal"
path = "src/main.rs"

[workspace.package]
edition = "2024"
repository = "https://github.com/Breeze141all/hawk-terminal"
homepage = "https://breeze141all.github.io/hawk-site/"

[workspace]
members = [ "data", "exchange", "indicator-engine"]

[workspace.dependencies]
iced_futures = { version = "0.14.0" }
iced_core = { version = "0.14.0", features = ["serde"] }
chrono = { version = "0.4.40", default-features = false, features = ["serde", "now", "clock"] }
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
serde_json = "1.0.140"
log = "0.4.22"
thiserror = "2.0.12"
regex = "1.11.1"
palette = "0.7.6"
num-traits = "0.2.19"
rustc-hash = "2.1.1"
enum-map = "2.7.3"
uuid = { version = "1.11.0", features = ["v4", "serde"] }
lz4_flex = "0.11"
arrow-ipc = { version = "59.1", default-features = false }
arrow-array = { version = "59.1", default-features = false }
arrow-schema = { version = "59.1", default-features = false }
bytes = "1.8.0"
url = "2.5"
reqwest = { version = "0.12.9", default-features = false, features = ["json", "rustls-tls", "stream"] }
bytemuck = { version = "1.25", features = ["derive"] }
iced_wgpu = "0.14.0"
indicator_engine = { version = "0.1.0", path = "indicator-engine", package = "indicator-engine" }


[dependencies]
iced = { version = "0.14.0", default-features = false, features = [
    "wgpu",
    "tokio",
    "canvas",
    "sipper",
    "advanced",
    "unconditional-rendering",
    "crisp",
    "x11",
    "wayland",
    "image",
] }
iced_core.workspace = true
iced_futures.workspace = true
chrono.workspace = true
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
log.workspace = true
uuid.workspace = true
palette.workspace = true
num-traits.workspace = true
rustc-hash.workspace = true
enum-map.workspace = true
fern = "0.7.1"
rodio = { version = "0.20.1", default-features = false, features = [ "wav" ]}
tokio = { version = "1.43", default-features = false, features = ["time"] }
arrow-ipc.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
reqwest.workspace = true
bytes.workspace = true
url.workspace = true
bytemuck.workspace = true
iced_wgpu.workspace = true

exchange = { version = "0.1.0", path = "exchange", package = "hawk-exchange" }
data = { version = "0.1.0", path = "data", package = "hawk-data", default-features = false }
indicator_engine.workspace = true
arboard = "3.6.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"
notify-rust = "4.18.1"
semver = "1.0"

[features]
default = ["volume-search"]
debug = ["iced/hot"]
volume-search = ["data/volume-search"]

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"
